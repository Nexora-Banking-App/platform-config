apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexora-workloads
  namespace: argocd
  annotations:
    # Wave 5: after External Secrets, the CRDs, Istio policy and Kafka are healthy
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: 'https://github.com/Nexora-Banking-App/platform-config.git'
    targetRevision: HEAD
    path: platform-manifests/nexora-workloads
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nexora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: fraud-service
      jsonPointers:
        - /spec/replicas