apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: '7.3.7'
    chart: grafana
    helm:
      values: |
        # ZERO SECRETS IN GIT: Pull password from ESO Secret!
        admin:
          existingSecret: "grafana-admin-credentials"
          userKey: admin-user     # Defaults to 'admin' if missing
          passwordKey: admin-password

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                url: http://prometheus-server.monitoring.svc.cluster.local
                access: proxy
                isDefault: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true