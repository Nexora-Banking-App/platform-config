apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexora-workloads
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Nexora-Banking-App/platform-config.git'
    targetRevision: HEAD
    path: platform-manifests/nexora-workloads
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: nexora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  # CRITICAL FIX: Tells ArgoCD to let HPA scale replicas without self-healing them!
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: fraud-service
      jsonPointers:
        - /spec/replicas