---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-init-job-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      job-name: nexora-db-init-job
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 3306