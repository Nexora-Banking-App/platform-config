# Allow the Gateway pod to receive public traffic and route to frontend & api-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexora-gateway-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: nexora-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {} # Allow public ingress (load balancer and health checks)
  egress:
    # gateway -> frontend-web
    - to:
        - podSelector:
            matchLabels:
              app: frontend-web
      ports:
        - protocol: TCP
          port: 8080
    # gateway -> api-gateway
    - to:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8000
    # gateway -> istiod (config and certificates)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
    # DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53