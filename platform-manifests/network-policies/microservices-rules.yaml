# =============================================================================
# 1. FRONTEND WEB (Ingress on Port 80)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-web-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      app: frontend-web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
---
# =============================================================================
# 2. API GATEWAY (Routes to Auth, Account, and Transaction)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["auth-service", "account-service", "transaction-service"]
      ports:
        - protocol: TCP
          port: 8000
---
# =============================================================================
# 3. AUTH SERVICE (Reaches MySQL 3306 & Transaction Service 8000)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # 1. Egress to MySQL database
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 3306
    # 2. Egress to Transaction Service (For Onboarding Grants)
    - to:
        - podSelector:
            matchLabels:
              app: transaction-service
      ports:
        - protocol: TCP
          port: 8000
---
# =============================================================================
# 4. ACCOUNT SERVICE (Strictly Read-Only: Reaches MySQL 3306)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-service-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      app: account-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 3306
---
# =============================================================================
# 5. TRANSACTION SERVICE (Reaches MySQL 3306 & Fraud Service 8000)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transaction-service-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      app: transaction-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allows calls from API Gateway AND Auth Service (for onboarding grants)
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["api-gateway", "auth-service"]
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # 1. Egress to Fraud Service
    - to:
        - podSelector:
            matchLabels:
              app: fraud-service
      ports:
        - protocol: TCP
          port: 8000
    # 2. Egress to MySQL Database
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 3306
---
# =============================================================================
# 6. FRAUD SERVICE (Compute-Only: Ingress strictly from Transaction Service)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fraud-service-policy
  namespace: nexora
spec:
  podSelector:
    matchLabels:
      app: fraud-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: transaction-service
      ports:
        - protocol: TCP
          port: 8000