apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

helmCharts:
  # 1. Grafana Loki - log database
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 5.41.5
    releaseName: loki
    namespace: logging
    valuesInline:
      loki:
        auth_enabled: false

        commonConfig:
          replication_factor: 1

        storage:
          type: filesystem

      singleBinary:
        replicas: 1

      # Disable tests to pass validation when self-monitoring is off
      test:
        enabled: false

      monitoring:
        selfMonitoring:
          enabled: false
          grafanaAgent:
            installOperator: false
        lokiCanary:
          enabled: true

  # 2. Fluent Bit - collects logs from Kubernetes nodes
  - name: fluent-bit
    repo: https://fluent.github.io/helm-charts
    version: 0.43.0
    releaseName: fluent-bit
    namespace: logging
    valuesInline:
      config:
        # The chart's default filter already has Merge_Log On / Keep_Log Off /
        # K8S-Logging.Parser On; it is repeated here so the behaviour the Loki
        # labels and dashboards depend on is explicit. The grep filter drops
        # probe and scrape noise (plain uvicorn access lines and JSON access lines).
        filters: |
          [FILTER]
              Name kubernetes
              Match kube.*
              Merge_Log On
              Keep_Log Off
              K8S-Logging.Parser On
              K8S-Logging.Exclude On

          [FILTER]
              Name grep
              Match kube.*
              Exclude log (GET|HEAD) /(health|metrics)
              Exclude path ^/(health|metrics)

        # Low-cardinality stream labels only: namespace, pod, container, app.
        # Everything else stays in the JSON log line and is queried with `| json`.
        outputs: |
          [OUTPUT]
              Name loki
              Match kube.*
              Host loki-gateway.logging.svc.cluster.local
              Port 80
              Labels job=fluentbit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], app=$kubernetes['labels']['app']
              Auto_Kubernetes_Labels Off
              Remove_Keys kubernetes,stream
              Line_Format json

          [OUTPUT]
              Name loki
              Match host.*
              Host loki-gateway.logging.svc.cluster.local
              Port 80
              Labels job=fluentbit-host
