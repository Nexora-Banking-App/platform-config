apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: nexora
  annotations:
    # Wave 2: Applies ONLY after the Istio CRDs in Wave 0/1 are installed!
    argocd.argoproj.io/sync-wave: "2"
spec:
  mtls:
    # PERMISSIVE: sidecars use mTLS with each other and still accept plain HTTP
    # (Prometheus scrapes, the load balancer). STRICT is the hardening target;
    # see "Known Gaps" in the README. The resource name is historical.
    mode: PERMISSIVE
