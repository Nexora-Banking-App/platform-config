apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 0.9.11
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      serviceAccount:
        create: true
        name: external-secrets
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::800770414458:role/nexora-staging-external-secrets

resources:
  - secret-store.yaml