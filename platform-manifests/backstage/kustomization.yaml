apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

helmCharts:
  - name: backstage
    repo: https://charts.bitnami.com/bitnami
    version: 1.3.1
    releaseName: backstage
    namespace: backstage
    valuesInline:
      # Tell Backstage where to find our architecture catalog!
      backstage:
        extraAppConfig:
          - filename: app-config.extra.yaml
            config:
              catalog:
                locations:
                  # Replace YOUR_GITHUB_ORG with 'Nexora-Banking-App'
                  - type: url
                    target: https://github.com/Nexora-Banking-App/nexora-apps/blob/main/catalog-info.yaml
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi