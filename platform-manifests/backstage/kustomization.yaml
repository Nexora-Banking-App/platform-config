apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

helmCharts:
  - name: backstage
    repo: https://backstage.github.io/charts
    version: 1.6.0 # Official Backstage chart version
    releaseName: backstage
    namespace: backstage
    valuesInline:
      # Inject the catalog configuration directly into app-config.yaml
      appConfig:
        catalog:
          locations:
            - type: url
              target: https://github.com/Nexora-Banking-App/nexora-apps/blob/main/catalog-info.yaml
      
      # Resource limits for staging
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits: