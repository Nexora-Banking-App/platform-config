apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

helmCharts:
  - name: backstage
    repo: https://backstage.github.io/charts
    version: 1.6.0
    releaseName: backstage
    namespace: backstage

# RFC 6902 JSON PATCH:
# Appends our 4 environment variables directly into containers[0].env without schema errors!
patches:
  - target:
      kind: Deployment
      name: backstage
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_CONFIG_backend_auth_dangerouslyDisableDefaultAuthPolicy
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_CONFIG_auth_environment
          value: "development"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_CONFIG_catalog_locations_0_type
          value: "url"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_CONFIG_catalog_locations_0_target
          value: "https://raw.githubusercontent.com/Nexora-Banking-App/nexora-apps/main/catalog-info.yaml"    