apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

helmCharts:
  - name: backstage
    repo: https://backstage.github.io/charts
    version: 1.6.0
    releaseName: backstage
    namespace: backstage

# Clean RFC 6902 JSON Patch (Only scalar auth bypass keys! Zero invalid array keys!)
patches:
  - target:
      kind: Deployment
      name: backstage
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_CONFIG_backend_auth_dangerouslyDisableDefaultAuthPolicy
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_CONFIG_auth_environment
          value: "development"