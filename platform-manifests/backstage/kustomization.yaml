apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

helmCharts:
  - name: backstage
    repo: https://backstage.github.io/charts
    version: 1.6.0
    releaseName: backstage
    namespace: backstage

# KUSTOMIZE POST-INFLATION PATCH:
# Forces the environment variables directly into the pod spec after Helm renders!
patches:
  - target:
      kind: Deployment
      name: backstage
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backstage
      spec:
        template:
          spec:
            containers:
              - name: backstage
                env:
                  - name: APP_CONFIG_backend_auth_dangerouslyDisableDefaultAuthPolicy
                    value: "true"
                  - name: APP_CONFIG_auth_environment
                    value: "development"
                  - name: APP_CONFIG_catalog_locations_0_type
                    value: "url"
                  - name: APP_CONFIG_catalog_locations_0_target
                    value: "https://raw.githubusercontent.com/Nexora-Banking-App/nexora-apps/main/catalog-info.yaml"