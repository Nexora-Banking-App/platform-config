apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-auth-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    # 1. Pull the password dynamically from AWS Secrets Manager
    - secretKey: admin-password
      remoteRef:
        key: nexora/staging/db-credentials
        property: GRAFANA_ADMIN_PASSWORD
        
  # 2. Inject the static username directly into the secret
  template:
    data:
      admin-user: "admin"