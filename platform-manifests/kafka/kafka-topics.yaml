# One topic per event stream.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions.events
  namespace: kafka
  labels:
    strimzi.io/cluster: nexora-kafka
spec:
  # 6 partitions >= fraud-service HPA max (5 pods) so every pod gets work
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000   # 7 days
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: transactions.events.dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: nexora-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: users.events
  namespace: kafka
  labels:
    strimzi.io/cluster: nexora-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: auth.events
  namespace: kafka
  labels:
    strimzi.io/cluster: nexora-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 259200000   # 3 days
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: fraud.alerts
  namespace: kafka
  labels:
    strimzi.io/cluster: nexora-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 2592000000  # 30 days