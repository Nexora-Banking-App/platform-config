# Staging-sized: 3 combined controller+broker nodes (KRaft, no ZooKeeper).
# Same replication settings as production so behaviour matches; only the sizes are small.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: nexora-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: ebs-gp3
        # Keep the EBS volumes if the cluster resource is ever deleted
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
  template:
    pod:
      affinity:
        # Prefer different nodes; "preferred" so scheduling still works on 2 nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    strimzi.io/pool-name: dual-role
                topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nexora-kafka
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    # Spread replicas across availability zones
    rack:
      type: topology-label
      topologyKey: topology.kubernetes.io/zone
    listeners:
      # Clients connect here: nexora-kafka-kafka-bootstrap.kafka.svc:9093
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # Topics are declared in Git (kafka-topics.yaml), never auto-created
      auto.create.topics.enable: false
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 256Mi