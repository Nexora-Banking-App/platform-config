apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

helmCharts:
  - name: strimzi-kafka-operator
    repo: https://strimzi.io/charts/
    version: 1.2.0
    releaseName: strimzi-operator
    namespace: kafka
    # Strimzi ships its CRDs in the chart's crds/ folder
    includeCRDs: true
    valuesInline:
      # Operator only manages the kafka namespace
      watchNamespaces:
        - kafka