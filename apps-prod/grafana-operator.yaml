# grafana-operator: owns the Grafana, GrafanaDatasource and GrafanaDashboard CRDs.
# Installed straight from the operator's OCI Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: ghcr.io/grafana/helm-charts
    chart: grafana-operator
    targetRevision: 5.25.0
    helm:
      releaseName: grafana-operator
      values: |
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
